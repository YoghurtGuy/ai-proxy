name: Build Docker Image

# 只在打 tag 或手动触发时出镜像。
#   git tag v0.2.0 && git push --tags      -> :0.2.0 和 :latest
#   Actions 页面 Run workflow（选分支）    -> :<sha7>，不动 latest
#
# 需要预先配好仓库 Secrets（Settings > Secrets and variables > Actions）：
#   ACR_USERNAME  阿里云 ACR 用户名
#   ACR_PASSWORD  阿里云 ACR 密码

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE_NAME: registry.cn-beijing.aliyuncs.com/xjtuedu/ai-proxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存放 GitHub Actions 缓存，比每次全量重建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ACR 不认 provenance 生成的空描述符
          # （application/vnd.oci.empty.v1+json），会把镜像打成 manifest list 后直接 denied。
          # 关掉就是普通单镜像 manifest。
          provenance: false